name: Build planet

on:
  schedule:
    - cron: "17 * * * *"  # hourly at :17
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - planet.ini
      - templates/**
      - .github/workflows/build.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install pluto
        run: gem install pluto

      - name: Install template pack
        run: |
          mkdir -p ~/.pluto/steel
          cp templates/* ~/.pluto/steel/

      - name: Build
        run: pluto build planet.ini -t steel -o public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
